# Copy to secrets.yaml (gitignored) and fill in. Never commit secrets.yaml.
wifi_ssid: "your-wifi-name"
wifi_password: "your-wifi-password"
# The Pi's address on your network (a fixed IP or its .local name).
mqtt_broker: "growshed.local"
# Same value as MQTT_NODE_PASSWORD in the Pi's .env file.
mqtt_node_password: "change-me-node"
# Protects over-the-air firmware updates. Pick any long random string.
ota_password: "change-me-ota"
