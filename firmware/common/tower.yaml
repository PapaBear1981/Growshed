# Extra parts on the tower tent's node: tower reservoir temperature and low-level float.

one_wire:
  - platform: gpio
    pin: ${pin_onewire}

sensor:
  - platform: dallas_temp
    id: tower_temp
    name: tower_temp
    state_topic: growshed/${node_id}/sensor/tower_temp/state
    update_interval: 30s

binary_sensor:
  # Float switch between the pin and GND, closed while floating. ON = level is LOW.
  # A broken or unplugged wire also reads as LOW, which is the safe direction.
  - platform: gpio
    id: tower_low
    name: tower_low
    state_topic: growshed/${node_id}/binary_sensor/tower_low/state
    pin:
      number: ${pin_in2}
      mode: INPUT_PULLUP
    filters:
      - delayed_on: 5s
      - delayed_off: 5s
