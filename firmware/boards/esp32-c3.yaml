  pin_sda: GPIO6
  pin_scl: GPIO7
  pin_onewire: GPIO4
  pin_in1: GPIO0
  pin_in2: GPIO1
  pin_in3: GPIO3
  pin_in4: GPIO10
esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf
