# Board profile: ESP32 DevKit (WROOM-32)
# Pin names used by the node packages in ../common. Edit here if you wire differently.
substitutions:
  board_label: "ESP32 DevKit (WROOM-32)"
  pin_sda: GPIO21
  pin_scl: GPIO22
  pin_onewire: GPIO4
  pin_in1: GPIO32
  pin_in2: GPIO33
  pin_in3: GPIO25
  pin_in4: GPIO26
  # Analog inputs for soil moisture sensors (must be WiFi-safe ADC pins).
  pin_adc1: GPIO34
  pin_adc2: GPIO35
  pin_adc3: GPIO36
  pin_adc4: GPIO39
  # Outputs to relay boxes and pump driver boards.
  pin_out1: GPIO16
  pin_out2: GPIO17
  pin_out3: GPIO18
  pin_out4: GPIO19
  pin_out5: GPIO23
  pin_out6: GPIO27

esp32:
  board: esp32dev
  framework:
    type: esp-idf
