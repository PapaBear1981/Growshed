# Board profile: Arduino Nano ESP32
# Pin names used by the node packages in ../common. Edit here if you wire differently.
substitutions:
  board_label: "Arduino Nano ESP32"
  pin_sda: GPIO11
  pin_scl: GPIO12
  pin_onewire: GPIO5
  pin_in1: GPIO6
  pin_in2: GPIO7
  pin_in3: GPIO8
  pin_in4: GPIO9
  # Analog inputs for soil moisture sensors (must be WiFi-safe ADC pins).
  pin_adc1: GPIO1
  pin_adc2: GPIO2
  pin_adc3: GPIO4
  # Outputs to relay boxes and pump driver boards.
  pin_out1: GPIO10
  pin_out2: GPIO17
  pin_out3: GPIO18
  pin_out4: GPIO21
  pin_out5: GPIO38
  pin_out6: GPIO47

esp32:
  board: arduino_nano_esp32
  framework:
    type: esp-idf
