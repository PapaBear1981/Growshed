# Board profile: ESP32-S3 DevKitC
# Pin names used by the node packages in ../common. Edit here if you wire differently.
substitutions:
  board_label: "ESP32-S3 DevKitC"
  pin_sda: GPIO8
  pin_scl: GPIO9
  pin_onewire: GPIO4
  pin_in1: GPIO5
  pin_in2: GPIO6
  pin_in3: GPIO7
  pin_in4: GPIO15
  # Analog inputs for soil moisture sensors (must be WiFi-safe ADC pins).
  pin_adc1: GPIO1
  pin_adc2: GPIO2
  pin_adc3: GPIO10
  # Outputs to relay boxes and pump driver boards.
  pin_out1: GPIO16
  pin_out2: GPIO17
  pin_out3: GPIO18
  pin_out4: GPIO21
  pin_out5: GPIO38
  pin_out6: GPIO47

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
