  pin_sda: GPIO8
  pin_scl: GPIO9
  pin_onewire: GPIO4
  pin_in1: GPIO5
  pin_in2: GPIO6
  pin_in3: GPIO7
  pin_in4: GPIO15
esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
