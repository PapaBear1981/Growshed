# Growshed site configuration: what exists in the basement and how it maps to MQTT.
# Topic for each entry: growshed/<node>/<component>/<key>/state   (see docs/MQTT.md)
# Units are SI, exactly as the nodes publish them. The GUI converts for display.
# Binary sensors are ON when the named condition is true (leak = wet, level_low = level is low).

zones:
  - {id: tent1, name: "Tent 1", kind: tent}
  - {id: tent2, name: "Tent 2", kind: tent}
  - {id: tent3, name: "Tower tent", kind: tent}
  - {id: tower, name: "Strawberry tower", kind: tower, parent: tent3}
  - {id: soil, name: "Soil pots", kind: soil, parent: tent2}
  - {id: rdwc, name: "RDWC reservoir", kind: rdwc}
  - {id: room, name: "Basement", kind: room}

nodes:
  - {id: tent1, name: "Tent 1 node"}
  - {id: tent2, name: "Tent 2 node"}
  - {id: tent3, name: "Tower tent node"}
  - {id: dosing, name: "Dosing node"}
  - {id: water, name: "Water node"}

sensors:
  - {node: tent1, key: air_temp, zone: tent1, kind: temperature, unit: "°C", name: "Air temperature"}
  - {node: tent1, key: air_rh, zone: tent1, kind: humidity, unit: "%", name: "Humidity"}
  - {node: tent1, key: light_lux, zone: tent1, kind: illuminance, unit: "lx", name: "Light"}
  - {node: tent1, key: leak, component: binary_sensor, zone: tent1, kind: leak, name: "Floor leak"}
  - {node: tent2, key: air_temp, zone: tent2, kind: temperature, unit: "°C", name: "Air temperature"}
  - {node: tent2, key: air_rh, zone: tent2, kind: humidity, unit: "%", name: "Humidity"}
  - {node: tent2, key: light_lux, zone: tent2, kind: illuminance, unit: "lx", name: "Light"}
  - {node: tent2, key: leak, component: binary_sensor, zone: tent2, kind: leak, name: "Floor leak"}
  - {node: tent3, key: air_temp, zone: tent3, kind: temperature, unit: "°C", name: "Air temperature"}
  - {node: tent3, key: air_rh, zone: tent3, kind: humidity, unit: "%", name: "Humidity"}
  - {node: tent3, key: light_lux, zone: tent3, kind: illuminance, unit: "lx", name: "Light"}
  - {node: tent3, key: leak, component: binary_sensor, zone: tent3, kind: leak, name: "Floor leak"}
  # Soil moisture: the node sends volts; the hub shows % after calibration in the GUI.
  # One line per pot. Match the soil_N lines in firmware/tent2.yaml.
  - {node: tent2, key: soil_1, zone: soil, kind: soil_moisture, unit: "%", name: "Pot 1"}
  - {node: tent2, key: soil_2, zone: soil, kind: soil_moisture, unit: "%", name: "Pot 2"}
  - {node: tent2, key: soil_3, zone: soil, kind: soil_moisture, unit: "%", name: "Pot 3"}
  - {node: tent2, key: soil_4, zone: soil, kind: soil_moisture, unit: "%", name: "Pot 4"}
  - {node: tent2, key: water_tank_low, component: binary_sensor, zone: soil, kind: level_low, name: "Watering tank low"}
  - {node: tent3, key: tower_temp, zone: tower, kind: temperature, unit: "°C", name: "Water temperature"}
  - {node: tent3, key: tower_low, component: binary_sensor, zone: tower, kind: level_low, name: "Reservoir low"}
  - {node: water, key: res_temp, zone: rdwc, kind: temperature, unit: "°C", name: "Water temperature"}
  # Water chemistry: the node sends raw volts; the hub shows pH and EC (µS/cm) after
  # calibration in the GUI. EC is corrected to 25 °C with the reservoir's temperature.
  - {node: water, key: ph, zone: rdwc, kind: ph, unit: "pH", name: "pH"}
  - {node: water, key: ec, zone: rdwc, kind: ec, unit: "µS/cm", name: "EC"}
  - {node: dosing, key: leak, component: binary_sensor, zone: rdwc, kind: leak, name: "Leak under dosing pumps"}
  - {node: water, key: res_low, component: binary_sensor, zone: rdwc, kind: level_low, name: "Reservoir low"}
  - {node: water, key: res_high, component: binary_sensor, zone: rdwc, kind: level_high, name: "Reservoir full"}
  - {node: water, key: leak_res, component: binary_sensor, zone: rdwc, kind: leak, name: "Leak under reservoir"}
  - {node: water, key: leak_topoff, component: binary_sensor, zone: rdwc, kind: leak, name: "Leak under top-off tank"}
  - {node: water, key: room_temp, zone: room, kind: temperature, unit: "°C", name: "Air temperature"}
  - {node: water, key: room_rh, zone: room, kind: humidity, unit: "%", name: "Humidity"}

# circuit / watts are filled in once the basement breakers are mapped and loads measured.
devices:
  - {node: tent1, key: lights, zone: tent1, kind: light, name: "Lights"}
  - {node: tent1, key: exhaust_fan, zone: tent1, kind: fan, name: "Exhaust fan"}
  - {node: tent2, key: lights, zone: tent2, kind: light, name: "Lights"}
  - {node: tent2, key: exhaust_fan, zone: tent2, kind: fan, name: "Exhaust fan"}
  - {node: tent3, key: lights, zone: tent3, kind: light, name: "Lights"}
  - {node: tent3, key: exhaust_fan, zone: tent3, kind: fan, name: "Exhaust fan"}
  - {node: tent3, key: tower_pump, zone: tower, kind: pump, name: "Tower pump"}
  - {node: water, key: water_heater, zone: rdwc, kind: heater, name: "Water heater"}
  - {node: water, key: air_pump, zone: rdwc, kind: pump, name: "Air pump"}
  - {node: water, key: rdwc_pump, zone: rdwc, kind: pump, name: "Circulation pump"}
  # Dose pumps only run briefly when asked. dose_s = seconds requested each time.
  - {node: water, key: top_off, zone: rdwc, kind: pump, name: "Top-off pump", control: dose, dose_s: 120}
  - {node: tent2, key: water_1, zone: soil, kind: pump, name: "Pot 1 pump", control: dose, dose_s: 8}
  - {node: tent2, key: water_2, zone: soil, kind: pump, name: "Pot 2 pump", control: dose, dose_s: 8}
  - {node: tent2, key: water_3, zone: soil, kind: pump, name: "Pot 3 pump", control: dose, dose_s: 8}
  - {node: tent2, key: water_4, zone: soil, kind: pump, name: "Pot 4 pump", control: dose, dose_s: 8}

  # Chemical dosing pumps: driven only by the dosing logic below, in millilitres.
  - {node: dosing, key: ph_down, zone: rdwc, kind: doser, name: "pH down pump", control: doser}
  - {node: dosing, key: ph_up, zone: rdwc, kind: doser, name: "pH up pump", control: doser}
  - {node: dosing, key: nutrient_a, zone: rdwc, kind: doser, name: "Nutrient A pump", control: doser}
  - {node: dosing, key: nutrient_b, zone: rdwc, kind: doser, name: "Nutrient B pump", control: doser}

# Values stored on the nodes that the Controls page can change. min/max must match the
# firmware (firmware/common/*_control.yaml). Times are minutes after midnight; SI units.
settings:
  - {node: tent1, key: light_on_minute, zone: tent1, kind: time_of_day, name: "Lights on", min: 0, max: 1439}
  - {node: tent1, key: light_off_minute, zone: tent1, kind: time_of_day, name: "Lights off", min: 0, max: 1439}
  - {node: tent1, key: max_temp, zone: tent1, kind: temperature, name: "Fan on above (temperature)", min: 20, max: 30}
  - {node: tent1, key: max_rh, zone: tent1, kind: humidity, name: "Fan on above (humidity)", min: 40, max: 90}
  - {node: tent2, key: light_on_minute, zone: tent2, kind: time_of_day, name: "Lights on", min: 0, max: 1439}
  - {node: tent2, key: light_off_minute, zone: tent2, kind: time_of_day, name: "Lights off", min: 0, max: 1439}
  - {node: tent2, key: max_temp, zone: tent2, kind: temperature, name: "Fan on above (temperature)", min: 20, max: 30}
  - {node: tent2, key: max_rh, zone: tent2, kind: humidity, name: "Fan on above (humidity)", min: 40, max: 90}
  - {node: tent3, key: light_on_minute, zone: tent3, kind: time_of_day, name: "Lights on", min: 0, max: 1439}
  - {node: tent3, key: light_off_minute, zone: tent3, kind: time_of_day, name: "Lights off", min: 0, max: 1439}
  - {node: tent3, key: max_temp, zone: tent3, kind: temperature, name: "Fan on above (temperature)", min: 20, max: 30}
  - {node: tent3, key: max_rh, zone: tent3, kind: humidity, name: "Fan on above (humidity)", min: 40, max: 90}
  - {node: tent3, key: tower_on_s, zone: tower, kind: duration, name: "Pump on for", min: 0, max: 3600}
  - {node: tent3, key: tower_off_s, zone: tower, kind: duration, name: "Pump off for", min: 0, max: 14400}
  - {node: water, key: water_setpoint, zone: rdwc, kind: temperature, name: "Water temperature", min: 15, max: 24}

# Automatic soil watering (docs/SAFETY.md §4b). Each pot pairs a sensor with its pump.
# Every pot starts in OFF: turn AUTO on per pot on the Controls page.
# below = water when moisture falls under this many percent.
watering:
  soak_s: 1800
  max_doses_per_day: 6
  pots:
    - {name: "Pot 1", sensor: tent2/sensor/soil_1, pump: tent2/switch/water_1, tank_low: tent2/binary_sensor/water_tank_low, below: 35}
    - {name: "Pot 2", sensor: tent2/sensor/soil_2, pump: tent2/switch/water_2, tank_low: tent2/binary_sensor/water_tank_low, below: 35}
    - {name: "Pot 3", sensor: tent2/sensor/soil_3, pump: tent2/switch/water_3, tank_low: tent2/binary_sensor/water_tank_low, below: 35}
    - {name: "Pot 4", sensor: tent2/sensor/soil_4, pump: tent2/switch/water_4, tank_low: tent2/binary_sensor/water_tank_low, below: 35}

# pH and nutrient dosing for the RDWC reservoir (docs/SAFETY.md §4). It starts OFF. On the
# Water page it can be set to SUGGEST (you approve each dose) or, after a warning, AUTO.
# These limits cannot be raised above the dosing node's own (2 mL per dose, 20 mL per day).
# Start with small doses and watch what one dose does to YOUR reservoir before changing them.
dosing:
  zone: rdwc
  ph_sensor: water/sensor/ph
  ec_sensor: water/sensor/ec
  circulation: water/switch/rdwc_pump
  level_low: water/binary_sensor/res_low
  ph_down: dosing/switch/ph_down
  ph_up: dosing/switch/ph_up
  nutrient_a: dosing/switch/nutrient_a
  nutrient_b: dosing/switch/nutrient_b
  ph_low: 5.6            # dose pH up below this
  ph_high: 6.2           # dose pH down above this
  ec_low: 1000           # µS/cm: add nutrients below this (nothing is ever diluted)
  ph_dose_ml: 1.0
  nutrient_dose_ml: 2.0  # of EACH of A and B
  max_dose_ml: 2.0
  max_day_ml: 20.0
  wait_s: 900            # mixing time after any dose

# Alert rules (docs/SAFETY.md §5). Each rule applies to every sensor of that kind, so a
# new tent is covered automatically. Limits are SI (°C, %RH). for_s = how long the
# condition must last before alerting; repeat_s = re-notify until acknowledged.
alerts:
  node_offline_after_s: 300
  sensor_stale_after_s: 600
  clear_after_s: 60
  rules:
    - {name: "Leak detected", sensor_kind: leak, when_on: true, severity: critical, repeat_s: 300}
    - {name: "Reservoir low", sensor_kind: level_low, when_on: true, for_s: 30, severity: critical, repeat_s: 1800}
    - {name: "Tent too hot", sensor_kind: temperature, zone_kinds: [tent], above: 30, for_s: 120}
    - {name: "Tent too cold", sensor_kind: temperature, zone_kinds: [tent], below: 15, for_s: 120}
    - {name: "Tent humidity high", sensor_kind: humidity, zone_kinds: [tent], above: 75, for_s: 1800}
    - {name: "Basement humidity high", sensor_kind: humidity, zone_kinds: [room], above: 60, for_s: 3600}
    - {name: "Water too cold", sensor_kind: temperature, zone_kinds: [rdwc, tower], below: 16, for_s: 600}
    - {name: "Water too warm", sensor_kind: temperature, zone_kinds: [rdwc, tower], above: 24, for_s: 600}
    # 0 % = sensor in air, 100 % = sensor in water. Tune this limit to your soil and plants.
    - {name: "Soil dry", sensor_kind: soil_moisture, below: 30, for_s: 1800}
    # Water chemistry targets for the RDWC reservoir. Tune these to your crops:
    # leafy greens are happy around pH 5.5-6.5 and EC 0.8-1.6 mS/cm (800-1600 µS/cm).
    - {name: "pH too low", sensor_kind: ph, below: 5.3, for_s: 1800}
    - {name: "pH too high", sensor_kind: ph, above: 6.7, for_s: 1800}
    - {name: "Nutrients weak (EC low)", sensor_kind: ec, below: 700, for_s: 3600}
    - {name: "Nutrients strong (EC high)", sensor_kind: ec, above: 2200, for_s: 3600}
