<text x='30' y='809' font-size='12' font-weight='normal' fill='#3c4a41' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>• These are low-voltage signal wires only. Mains stays inside the relay boxes.</text>
<text x='30' y='828' font-size='12' font-weight='normal' fill='#3c4a41' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>• The 12 V supply&#x27;s minus must connect to the node&#x27;s GND (the board does this).</text>
