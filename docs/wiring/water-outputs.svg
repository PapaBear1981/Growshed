<text x='30' y='770' font-size='12' font-weight='normal' fill='#3c4a41' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>• Wires join only where there is a dot. Lines that simply cross are not connected.</text>
<text x='30' y='789' font-size='12' font-weight='normal' fill='#3c4a41' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>• These are low-voltage signal wires only. Mains stays inside the relay boxes.</text>
<text x='30' y='808' font-size='12' font-weight='normal' fill='#3c4a41' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>• Normally-ON outlets keep the air and circulation pumps running if the node dies.</text>
