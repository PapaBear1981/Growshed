<text x='30' y='622' font-size='12' font-weight='normal' fill='#3c4a41' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>• Wires join only where there is a dot. Lines that simply cross are not connected.</text>
<text x='30' y='641' font-size='12' font-weight='normal' fill='#3c4a41' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>• Power the board from a USB charger. Never connect 5 V to any of these pins.</text>
<text x='30' y='660' font-size='12' font-weight='normal' fill='#3c4a41' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>• Keep the two probes at least a hand&#x27;s width apart in the bucket.</text>
